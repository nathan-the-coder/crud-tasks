root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "tmp/main"
  full_bin = "tmp/main"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor"]
  include_dir = []
  exclude_file = []
  delay = 1000
  stop_on_error = true
  log = "build-errors.log"
  send_interrupt = true
  kill_delay = 500

[log]
  main_only = false
  time = false

[color]
  main = "cyan"
  watcher = "green"
  build = "yellow"
  runner = "magenta"

[misc]
  clean_on_exit = true
